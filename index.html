<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Sécurité : seuls Microsoft (connexion, Graph, OneDrive) et Google Fonts sont joignables. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://*.sharepoint.com https://*.1drv.com https://*.svc.ms; img-src 'self' data:; base-uri 'none'; form-action 'none'; worker-src 'self'; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#001232">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRM GFX">
<title>CRM GFX · Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --marine:#001232; --or:#C9A24B; --or-texte:#8A6D2A;
    --fond:#F6F5F1; --surface:#fff; --surface-2:#F0EEE8; --trait:#DDD8CC; --texte:#001232; --texte-2:#4B5466; --texte-3:#6B7280;
    --danger:#B3413A; --ok:#2E7D5B;
    --haut:env(safe-area-inset-top,0px); --bas:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root{ --fond:#0B1426; --surface:#13203A; --surface-2:#1B2A47; --trait:#2A3B5C; --texte:#EEF1F6; --texte-2:#B9C2D3; --texte-3:#8D97AA; --or-texte:#E3C379; }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--fond); color:var(--texte); font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:15px; }
  body{ padding-bottom:calc(64px + var(--bas)); min-height:100vh; }
  h1,h2,h3{ font-family:'Lora',Georgia,serif; font-weight:600; margin:0; }
  button{ font:inherit; color:inherit; }
  a{ color:inherit; }

  .barre{ position:sticky; top:0; z-index:20; background:var(--marine); color:#fff; padding:calc(10px + var(--haut)) 14px 10px; display:flex; align-items:center; gap:10px; }
  .marque{ font-family:'Lora',serif; font-weight:600; letter-spacing:.06em; color:var(--or); font-size:17px; }
  .barre h1{ font-size:18px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#fff; }
  .bouton-barre{ background:rgba(255,255,255,.12); border:none; color:#fff; border-radius:10px; min-width:40px; height:40px; font-size:17px; cursor:pointer; }
  .statut{ font-size:12px; padding:6px 14px; background:rgba(201,162,75,.16); color:var(--texte); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .statut .pastille{ background:var(--marine); color:#fff; border-radius:999px; padding:1px 8px; font-weight:700; font-size:11px; }
  .statut.erreur{ background:rgba(179,65,58,.14); color:var(--danger); }

  main{ padding:12px 14px 20px; max-width:720px; margin:0 auto; }
  .ligne-outils{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .segment{ display:flex; background:var(--surface-2); border-radius:10px; padding:3px; gap:3px; }
  .segment button{ border:none; background:transparent; padding:8px 12px; border-radius:8px; font-weight:600; font-size:13.5px; cursor:pointer; color:var(--texte-2); }
  .segment button[aria-pressed="true"]{ background:var(--surface); color:var(--texte); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .nav-date{ display:flex; align-items:center; gap:6px; flex:1; justify-content:flex-end; }
  .nav-date button{ border:1px solid var(--trait); background:var(--surface); border-radius:9px; height:38px; min-width:38px; padding:0 10px; cursor:pointer; font-weight:600; }
  .titre-jour{ font-family:'Lora',serif; font-size:19px; font-weight:600; margin:4px 0 10px; }
  .titre-jour small{ font-family:'Archivo',sans-serif; font-size:12.5px; font-weight:500; color:var(--texte-3); margin-left:6px; }

  .filtres-bouton{ border:1px solid var(--trait); background:var(--surface); border-radius:9px; height:38px; padding:0 12px; font-weight:600; cursor:pointer; }
  .filtres-bouton.actif{ background:var(--marine); color:#fff; border-color:var(--marine); }
  .filtres{ background:var(--surface); border:1px solid var(--trait); border-radius:12px; padding:10px 12px; margin-bottom:12px; }
  .filtres .etiquette{ font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--texte-3); margin:4px 0 6px; }
  .puces{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .puce{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--trait); background:var(--surface); color:var(--texte); border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer; }
  .puce .n{ font-size:11px; font-weight:700; background:var(--surface-2); color:var(--texte-2); border-radius:999px; padding:0 7px; line-height:18px; }
  .puce[aria-pressed="true"]{ background:var(--marine); color:#fff; border-color:var(--marine); }
  .puce[aria-pressed="true"] .n{ background:var(--or); color:var(--marine); }
  .resume-filtre{ font-size:12.5px; background:rgba(201,162,75,.16); border-radius:9px; padding:8px 10px; display:flex; gap:8px; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .resume-filtre button{ border:none; background:var(--marine); color:#fff; border-radius:7px; padding:6px 10px; font-weight:700; font-size:12px; cursor:pointer; white-space:nowrap; }

  .plages{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; }
  .plage{ flex-shrink:0; font-size:12px; border-radius:8px; padding:5px 9px; background:var(--surface); border:1px solid var(--trait); border-left-width:4px; white-space:nowrap; }
  .carte{ display:flex; gap:10px; align-items:flex-start; background:var(--surface); border:1px solid var(--trait); border-left:4px solid var(--trait); border-radius:12px; padding:10px 12px; margin-bottom:8px; cursor:pointer; text-align:left; width:100%; }
  .carte .heure{ font-weight:700; font-size:13px; min-width:52px; color:var(--texte-2); padding-top:1px; }
  .carte .corps{ flex:1; min-width:0; }
  .carte .texte{ font-weight:600; line-height:1.3; }
  .carte .sous{ font-size:12.5px; color:var(--texte-3); margin-top:2px; }
  .carte .badge{ display:inline-block; font-size:10.5px; font-weight:700; border-radius:5px; padding:1px 6px; margin-top:4px; background:rgba(201,162,75,.2); color:var(--or-texte); }
  .carte .badge.rouge{ background:rgba(179,65,58,.12); color:var(--danger); }
  .carte.occupe{ cursor:default; background:repeating-linear-gradient(135deg,rgba(120,120,120,.12) 0 6px,transparent 6px 12px),var(--surface); border-left-color:#8A8F99; }
  .carte.passee{ opacity:.55; }
  .section{ font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--texte-3); margin:16px 0 8px; display:flex; justify-content:space-between; }
  .vide{ text-align:center; color:var(--texte-3); padding:22px 10px; font-size:14px; background:var(--surface); border:1px dashed var(--trait); border-radius:12px; }
  .jour-semaine{ background:var(--surface); border:1px solid var(--trait); border-radius:12px; padding:10px 12px; margin-bottom:10px; }
  .jour-semaine h3{ font-size:15.5px; display:flex; justify-content:space-between; align-items:baseline; cursor:pointer; }
  .jour-semaine h3 small{ font-family:'Archivo',sans-serif; font-size:12px; color:var(--texte-3); font-weight:500; }
  .jour-semaine.auj{ border-color:var(--marine); box-shadow:inset 0 0 0 1px var(--marine); }
  .mini{ display:flex; gap:8px; padding:7px 0; border-top:1px solid var(--trait); font-size:13.5px; cursor:pointer; }
  .mini:first-of-type{ border-top:none; }
  .mini .h{ width:50px; flex-shrink:0; font-weight:700; color:var(--texte-2); font-size:12.5px; }
  .mini .t{ flex:1; min-width:0; }
  .mini .c{ color:var(--texte-3); font-size:12px; }

  .recherche{ width:100%; font:inherit; font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--trait); background:var(--surface); color:var(--texte); margin-bottom:10px; }
  .client{ display:flex; justify-content:space-between; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--trait); border-radius:12px; padding:11px 12px; margin-bottom:7px; cursor:pointer; width:100%; text-align:left; }
  .client .nom{ font-weight:600; }
  .client .sous{ font-size:12.5px; color:var(--texte-3); margin-top:2px; }
  .client .fl{ color:var(--texte-3); font-size:18px; }

  .fiche-tete{ margin:2px 0 12px; }
  .fiche-tete h2{ font-size:23px; }
  .fiche-tete .sous{ color:var(--texte-3); font-size:13px; margin-top:3px; }
  .actions{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .actions > a, .actions > button, .actions > span{ border:none; font-family:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; background:var(--marine); color:#fff; text-decoration:none; border-radius:12px; padding:10px 4px; font-weight:600; font-size:12.5px; }
  .actions > span{ background:var(--surface-2); color:var(--texte-3); cursor:default; }
  .actions .ic{ font-size:19px; }
  .bloc{ background:var(--surface); border:1px solid var(--trait); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .bloc h3{ font-size:15px; margin-bottom:8px; }
  .ligne-produit{ display:block; width:100%; text-align:left; background:var(--surface, #fff); border:1px solid var(--trait, #e3e0d8); border-left:3px solid #C9A24B; border-radius:8px; padding:9px 11px; margin:0 0 8px; font:inherit; font-size:14px; color:inherit; cursor:pointer; }
  .ligne-produit .comm{ display:block; font-size:12.5px; color:var(--texte-3, #5b6472); margin-top:2px; }
  .resume-produits{ margin:0 0 10px; }
  .grille{ display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; }
  .champ .e{ font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--texte-3); }
  .champ .v{ font-size:14.5px; margin-top:2px; word-break:break-word; }
  .champ.large{ grid-column:1 / -1; }
  .notes{ white-space:pre-wrap; font-size:14px; line-height:1.55; word-break:break-word; }
  .tache-fiche{ padding:8px 0; border-top:1px solid var(--trait); font-size:14px; }
  .tache-fiche:first-of-type{ border-top:none; }
  .tache-fiche .d{ font-size:12px; color:var(--texte-3); }
  .tache-fiche.faite{ color:var(--texte-3); text-decoration:line-through; }
  .retour{ border:none; background:none; color:var(--or-texte); font-weight:700; padding:6px 0; cursor:pointer; font-size:14px; }

  .champ-saisie{ width:100%; font:inherit; font-size:15px; padding:10px 12px; border-radius:10px; border:1px solid var(--trait); background:var(--surface); color:var(--texte); margin:4px 0 10px; }
  .bouton{ display:inline-block; border:none; background:var(--marine); color:#fff; border-radius:10px; padding:11px 16px; font-weight:700; cursor:pointer; text-decoration:none; }
  .bouton.second{ background:var(--surface); color:var(--texte); border:1px solid var(--trait); }
  .bouton.or{ background:var(--or); color:var(--marine); }
  .note{ font-size:12.5px; color:var(--texte-3); line-height:1.5; }
  details.guide{ font-size:13px; line-height:1.55; color:var(--texte-2); }
  details.guide summary{ cursor:pointer; font-weight:700; color:var(--texte); }
  details.guide ol{ padding-left:20px; }
  code{ background:var(--surface-2); border-radius:5px; padding:1px 5px; font-size:12.5px; word-break:break-all; }

  .onglets{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--trait); display:grid; grid-template-columns:repeat(4,1fr); padding-bottom:var(--bas); }
  .onglets button{ border:none; background:none; padding:8px 0 9px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11.5px; font-weight:600; color:var(--texte-3); cursor:pointer; }
  .onglets button .ic{ font-size:20px; }
  .onglets button[aria-current="page"]{ color:var(--texte); }
  .onglets button[aria-current="page"] .ic{ filter:none; }
  .onglets button[aria-current="page"]::after{ content:''; width:22px; height:3px; border-radius:2px; background:var(--or); margin-top:2px; }

  .ecran-plein{ position:fixed; inset:0; z-index:50; background:var(--marine); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center; gap:14px; }
  .ecran-plein h2{ color:#fff; font-size:24px; }
  .ecran-plein p{ color:#C9CFDA; max-width:340px; line-height:1.5; margin:0; }
  /* Agenda façon Google Agenda (téléphone) */
  .cal-tete{ display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  .cal-titre-tel{ font-family:'Lora',Georgia,serif; font-size:21px; font-weight:600; flex:1; min-width:0; }
  .rond{ border:1px solid var(--trait); background:var(--surface); border-radius:19px; min-width:38px; height:38px; padding:0 10px; font-weight:600; cursor:pointer; color:var(--texte); }
  .segment-vues{ overflow-x:auto; max-width:100%; }
  .segment-vues button{ white-space:nowrap; padding:8px 10px; }
  .fab{ position:fixed; right:18px; bottom:calc(78px + var(--bas)); z-index:25; width:58px; height:58px; border-radius:18px; border:none; background:var(--surface); color:var(--or); font-size:34px; line-height:1; box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer; }
  .pl-jour{ display:grid; grid-template-columns:52px minmax(0,1fr); gap:10px; padding:8px 0; border-bottom:1px solid var(--trait); }
  .pl-date{ display:flex; flex-direction:column; align-items:center; cursor:pointer; padding-top:2px; }
  .pl-num{ font-family:'Lora',serif; font-size:22px; font-weight:600; line-height:1.1; width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
  .pl-date.auj .pl-num{ background:var(--marine); color:#fff; }
  .pl-sem{ font-size:11px; font-weight:700; text-transform:uppercase; color:var(--texte-3); }
  .pl-evt{ display:flex; gap:8px; align-items:flex-start; background:var(--surface); border:1px solid var(--trait); border-left:5px solid #6E7581; border-radius:10px; padding:8px 10px; margin-bottom:6px; cursor:pointer; }
  .pl-evt.bloque{ background:repeating-linear-gradient(135deg,rgba(95,102,112,.14) 0 6px,transparent 6px 12px),var(--surface); border-left-color:#5F6670; }
  .pl-evt.faite{ opacity:.55; text-decoration:line-through; }
  .pl-h{ font-size:12px; font-weight:700; color:var(--texte-2); width:88px; flex-shrink:0; padding-top:1px; }
  .pl-t{ font-weight:600; min-width:0; flex:1; line-height:1.3; }
  .pl-t small{ display:block; font-weight:500; font-size:12px; color:var(--texte-3); margin-top:1px; }
  .grille-tel{ background:var(--surface); border:1px solid var(--trait); border-radius:12px; overflow:hidden; }
  .g-entete, .g-journee, .g-corps{ display:grid; }
  .g-entete{ border-bottom:1px solid var(--trait); }
  .g-jour{ text-align:center; padding:6px 0; cursor:pointer; border-left:1px solid var(--trait); }
  .g-jour small{ display:block; font-size:10px; font-weight:700; text-transform:uppercase; color:var(--texte-3); }
  .g-jour b{ display:inline-flex; width:30px; height:30px; align-items:center; justify-content:center; border-radius:50%; font-family:'Lora',serif; font-size:17px; }
  .g-jour b.auj{ background:var(--marine); color:#fff; }
  .g-journee{ border-bottom:1px solid var(--trait); }
  .g-lib{ font-size:9px; color:var(--texte-3); text-align:right; padding:4px 3px 0 0; }
  .g-jcel{ border-left:1px solid var(--trait); padding:2px; min-width:0; }
  .g-jevt{ display:block; font-size:10.5px; font-weight:600; background:var(--surface-2); border-left:3px solid #6E7581; border-radius:4px; padding:1px 4px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .g-jplus{ display:block; font-size:10px; font-weight:700; color:var(--texte-2); padding:0 4px; cursor:pointer; }
  .g-corps{ max-height:calc(100vh - 290px); overflow-y:auto; }
  .g-heures{ position:relative; }
  .g-heures span{ position:absolute; right:4px; font-size:9.5px; color:var(--texte-3); }
  .g-col{ position:relative; border-left:1px solid var(--trait); background-image:linear-gradient(to bottom, var(--trait) 1px, transparent 1px); }
  .g-bande{ position:absolute; left:0; right:0; border-left:3px solid transparent; pointer-events:none; }
  .g-passe{ position:absolute; left:0; right:0; top:0; background:rgba(127,127,127,.07); pointer-events:none; }
  .g-evt{ position:absolute; border-radius:5px; padding:1px 4px; overflow:hidden; font-size:10.5px; line-height:1.25; color:#fff; cursor:pointer; z-index:2; box-sizing:border-box; }
  .g-evt b{ display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .g-evt small{ display:block; opacity:.9; }
  .g-evt.fixe{ box-shadow:inset 3px 0 0 rgba(255,255,255,.6); }
  .g-evt.auto{ outline:1px dashed rgba(255,255,255,.6); outline-offset:-2px; }
  .g-evt.faite{ background:var(--surface-2); color:var(--texte-2); border-left:3px solid; text-decoration:line-through; }
  .g-evt.passee{ opacity:.55; }
  .g-evt.bloque{ background:repeating-linear-gradient(135deg,rgba(95,102,112,.4) 0 5px,rgba(95,102,112,.2) 5px 10px); color:var(--texte); }
  .g-maintenant{ position:absolute; left:0; right:0; border-top:2px solid #D93025; z-index:3; pointer-events:none; }
  .mois-tel{ background:var(--surface); border:1px solid var(--trait); border-radius:12px; overflow:hidden; }
  .m-sem, .m-grille{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
  .m-sem span{ text-align:center; font-size:11px; font-weight:700; color:var(--texte-3); padding:5px 0; }
  .m-case{ min-height:74px; border-top:1px solid var(--trait); border-left:1px solid var(--trait); padding:2px; cursor:pointer; min-width:0; }
  .m-case.hors{ background:var(--surface-2); opacity:.7; }
  .m-num{ display:inline-flex; width:22px; height:22px; align-items:center; justify-content:center; border-radius:50%; font-size:11.5px; font-weight:700; }
  .m-num.auj{ background:var(--marine); color:#fff; }
  .m-evt{ display:block; font-size:9.5px; color:#fff; border-radius:3px; padding:0 3px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .m-plus{ display:block; font-size:9.5px; font-weight:700; color:var(--texte-2); }
  .cocher{ width:22px; height:22px; border:2px solid var(--texte-3); border-radius:6px; flex-shrink:0; margin:1px 10px 0 0; cursor:pointer; background:var(--surface); }
  .tache-fiche{ display:flex; align-items:flex-start; }
  .mini-plus{ float:right; border:none; background:none; color:var(--or-texte); font-weight:700; font-size:13px; cursor:pointer; }
  .voile{ position:fixed; inset:0; z-index:40; background:rgba(0,18,50,.4); }
  .feuille{ position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--surface); border-radius:18px 18px 0 0; padding:8px 16px calc(18px + var(--bas)); max-height:82vh; overflow-y:auto; box-shadow:0 -6px 24px rgba(0,0,0,.2); max-width:720px; margin:0 auto; }
  .feuille .poignee{ width:42px; height:5px; border-radius:3px; background:var(--trait); margin:2px auto 10px; }
  .feuille h3{ font-size:18px; margin-bottom:4px; }
  .f-tete{ display:flex; gap:10px; align-items:flex-start; margin-bottom:8px; }
  .f-carre{ width:16px; height:16px; border-radius:4px; flex-shrink:0; margin-top:5px; }
  .f-ligne{ display:flex; gap:10px; font-size:14px; padding:4px 0; }
  .f-ligne span{ width:80px; flex-shrink:0; color:var(--texte-3); }
  .f-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .f-actions.colonne{ flex-direction:column; }
  .f-actions .bouton{ font-size:14px; padding:11px 14px; }
  .f-rang{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .f-rang label, .feuille label{ font-size:12px; font-weight:700; color:var(--texte-3); }
  .f-case{ display:flex !important; align-items:center; gap:8px; font-size:14px !important; color:var(--texte) !important; }

    if(anneeDe(d) === anneeDe(f)) return jourDe(d) + ' ' + MOIS_COURTS[moisDe(d)] + ' – ' + jourDe(f) + ' ' + MOIS_COURTS[moisDe(f)] + ' ' + anneeDe(f);
    return jourDe(d) + ' ' + MOIS_COURTS[moisDe(d)] + ' ' + anneeDe(d) + ' – ' + jourDe(f) + ' ' + MOIS_COURTS[moisDe(f)] + ' ' + anneeDe(f);

  // Grille d'un mois : 6 semaines du lundi au dimanche (comme le mini-calendrier).
  function grilleMois(date){
    const debut = lundiDe(premierDuMois(date)), l = [];
    for(let i = 0; i < 42; i++){ const d = plusJours(debut, i); l.push({ date: d, jour: jourDe(d), dansMois: moisDe(d) === moisDe(date) }); }

  }
  const enteteJour = (iso) => ({ court: JOURS_COURTS[jourSemaine(iso)].replace(/^./, c => c.toUpperCase()), numero: jourDe(iso) });

  // ---- Couleurs --------------------------------------------------------------------------
  // Trois façons de colorer (au choix) : par type de tâche, par séquence, par plage horaire.
  const MODES_COULEUR = [
    { id: 'type', libelle: 'Par type de tâche' },
    { id: 'sequence', libelle: 'Par séquence' },
    { id: 'plage', libelle: 'Par plage horaire' }
  ];
  const COULEURS_TYPES = {
    'Appel': '#1E7F6E', 'Message texte': '#2F8FB0', 'Courriel': '#4A63C2', 'Suivi': '#7A52B3', 'Rendez-vous': '#C28A1E',
    'Signature': '#B5443C', 'Préparation de dossier': '#2F5A9E', 'Proposition d’assurance': '#9A6B12', 'Envoyer documents': '#4F7D2E',
    'Conformité': '#2D7A4B'
  };
  // Couleurs franches, lisibles en texte blanc, pour les types inconnus et les séquences.
  const PALETTE = ['#1E7F6E', '#4A63C2', '#B5443C', '#7A52B3', '#C28A1E', '#2F8FB0', '#4F7D2E', '#A23E7A', '#2F5A9E', '#8B5A2B', '#3E7C8C', '#6B6F1E'];
  const GRIS = '#6E7581';
  const COULEUR_BLOQUE = '#5F6670';
  function hachage(texte){ let h = 0; for(const c of String(texte)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
  const couleurType = (cat) => !cat ? GRIS : (COULEURS_TYPES[cat] || PALETTE[hachage(cat) % PALETTE.length]);
  // Les séquences connues gardent toujours la même couleur, dans l'ordre des réglages.
  function couleurSequence(nom, sequences){
    if(!nom) return GRIS;
    const i = (sequences || []).indexOf(nom);
    return PALETTE[(i >= 0 ? i + 4 : hachage(nom)) % PALETTE.length];
  }
  // x : une tâche planifiée du CRM { tache, plageId } ; plages : celles du jour ({ id, type }).
  function couleurEvenement(x, mode, plages, sequences){
    const t = (x && x.tache) || {};
    if(mode === 'sequence') return couleurSequence(t.seqNom || '', sequences);
    if(mode === 'plage'){
      const pl = (plages || []).find(p => p.id === x.plageId);
      return pl && pl.type && pl.type.couleur ? pl.type.couleur : GRIS;
    }
    return couleurType(t.categorie || '');
  }
  // La légende (« Mes agendas ») de la période affichée, pour le mode choisi.
  function legende(mode, evenements, plagesTypes, sequences, nomCategorie){
    const vus = new Map();
    if(mode === 'plage'){
      (plagesTypes || []).forEach(t => vus.set(t.nom, { cle: t.id, libelle: t.nom, couleur: t.couleur }));
      vus.set('__hors', { cle: '', libelle: 'Hors plage', couleur: GRIS });
      return [...vus.values()];
    }
    (evenements || []).forEach(x => {
      const t = x.tache || {};
      const cle = mode === 'sequence' ? (t.seqNom || '') : (nomCategorie ? nomCategorie(t.categorie || '') : (t.categorie || ''));
      if(!vus.has(cle)) vus.set(cle, { cle, libelle: cle || (mode === 'sequence' ? 'Hors séquence' : 'Sans catégorie'),
        couleur: mode === 'sequence' ? couleurSequence(cle, sequences) : couleurType(cle) });
    });
    if(mode === 'sequence') (sequences || []).forEach(n => { if(!vus.has(n)) vus.set(n, { cle: n, libelle: n, couleur: couleurSequence(n, sequences) }); });

  // Fond pâle d'une couleur (bandes des plages, événements passés).
  function teinte(hex, alpha){

    if(!m) return 'rgba(110,117,129,' + alpha + ')';

  // Comme Google : côte à côte dans des « voies ». Chaque élément { deMin, finMin } reçoit
  // voie (0…) et nbVoies. `minMin` : durée minimale à l'écran (une carte a une hauteur).
  function disposer(items, minMin){
    const min = minMin || 0;
    items.forEach(it => { it.finVis = Math.max(it.finMin, it.deMin + min); });
    const tri = items.slice().sort((a, b) => a.deMin - b.deMin || b.finVis - a.finVis);
    let groupe = [], fin = -1;
    const fermer = () => {
      const voies = [];
      groupe.forEach(it => {
        let i = voies.findIndex(f => f <= it.deMin);
        if(i === -1){ i = voies.length; voies.push(0); }
        voies[i] = it.finVis; it.voie = i;
      });
      groupe.forEach(it => { it.nbVoies = voies.length; });
      groupe = []; fin = -1;
    };
    tri.forEach(it => { if(groupe.length && it.deMin >= fin) fermer(); groupe.push(it); fin = Math.max(fin, it.finVis); });
    if(groupe.length) fermer();
    return items;
  }
  // Minutes → « 9 h 30 », bornes d'une grille arrondies à l'heure.
  const heureLisible = (min) => { const m = Math.max(0, Math.min(1439, Math.round(min))); return Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + pad(m % 60) : ''); };
  const hhmm = (min) => { const m = Math.max(0, Math.min(1439, Math.round(min))); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
  // Heure voulue d'une tâche, en minutes (null si aucune) : l'heure du rendez-vous ou de la
  // tâche (`heure`), sinon l'heure fixée à la main dans l'agenda (`planFixe` + `planHeure`).
  // Sert à montrer l'heure même quand la tâche n'a pas trouvé de place ce jour-là.
  const heureVoulue = (t) => {
    const ok = (h) => /^([01]\d|2[0-3]):[0-5]\d$/.test(h || '');
    const h = t && (ok(t.heure) ? t.heure : (t.planFixe && ok(t.planHeure) ? t.planHeure : ''));
    return h ? Number(h.slice(0, 2)) * 60 + Number(h.slice(3, 5)) : null;
  };
  // Heure choisie par le conseiller (Thomas, 8 oct. 2026) : « 📌 10 h 30 · », à respecter.
  const EPINGLE = '📌';
  const prefixeFixe = (min) => (min == null || isNaN(min) ? '' : EPINGLE + ' ' + heureLisible(min) + ' · ');
  // « 9 h 30 · » devant un libellé, ou rien.
  const prefixeHeure = (min) => (min == null || isNaN(min) ? '' : heureLisible(min) + ' · ');
  // Minute visée par un clic dans une colonne (arrondie au quart d'heure, comme Google).
  const minuteAuClic = (y, hauteur, deMin, aMin, pas) => {
    const p = pas || 15, brut = deMin + Math.max(0, Math.min(1, y / hauteur)) * (aMin - deMin);
    // + 1e-6 : 119,9999 minutes (virgule flottante) doit donner 10 h, pas 9 h 45.
    return Math.max(deMin, Math.min(aMin - p, Math.floor(brut / p + 1e-6) * p));
  };

  const api = {
    VUES, vue, PLANNING_JOURS, MODES_COULEUR, COULEURS_TYPES, PALETTE, GRIS, COULEUR_BLOQUE, MOIS, MOIS_COURTS, JOURS, JOURS_COURTS, INITIALES,
    plusJours, plusMois, lundiDe, premierDuMois, dernierDuMois, jourSemaine,
    joursAffiches, decaler, titre, grilleMois, enteteJour, libelleJour,
    couleurType, couleurSequence, couleurEvenement, legende, teinte,
    disposer, heureLisible, hhmm, minuteAuClic, heureVoulue, prefixeHeure, prefixeFixe, EPINGLE
  };
  if(typeof module === 'object' && module.exports) module.exports = api;
  racine.Calendrier = api;
})(typeof window !== 'undefined' ? window : globalThis);

  <script>// Coffre du téléphone : chiffre l'instantané que le CRM dépose dans Google Drive, et le
// déchiffre sur le téléphone. Commun au CRM (ordinateur) et à mobile/ (téléphone).
//
// - Clé tirée du code choisi par le conseiller : PBKDF2-SHA-256, 600 000 tours, sel au hasard
//   à chaque envoi. Chiffrement AES-GCM 256 bits (authentifié : un fichier altéré ou un mauvais
//   code est refusé, jamais « à moitié lu »).
// - Rien de lisible dans le fichier hormis la date d'envoi : ni nom, ni téléphone, ni note.
//   Google Drive ne voit qu'un bloc chiffré.
// - Compression gzip avant chiffrement quand le navigateur la connaît (notes = beaucoup de texte).
// Aucune bibliothèque externe : WebCrypto du navigateur seulement.
(function(racine){
  'use strict';
  const FORMAT = 'gfx-telephone', VERSION = 1, ITERATIONS = 600000;
  const subtle = () => {
    const s = racine.crypto && racine.crypto.subtle;
    if(!s) throw new Error('Chiffrement indisponible dans ce navigateur (page non sécurisée).');
    return s;
  };

  function versBase64(octets){
    const u = new Uint8Array(octets);
    let s = '';
    for(let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function depuisBase64(texte){
    const s = atob(String(texte || ''));
    const u = new Uint8Array(s.length);
    for(let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return u;
  }
  const hasard = (n) => { const a = new Uint8Array(n); racine.crypto.getRandomValues(a); return a; };

  async function transformer(octets, Flux){
    const flux = new Blob([octets]).stream().pipeThrough(new Flux('gzip'));
    return new Uint8Array(await new Response(flux).arrayBuffer());
  }
  const gzipConnu = () => typeof racine.CompressionStream === 'function' && typeof racine.DecompressionStream === 'function';

  async function cleDepuisCode(code, sel, iterations){
    const base = await subtle().importKey('raw', new TextEncoder().encode(String(code)), 'PBKDF2', false, ['deriveKey']);
    return subtle().deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: sel, iterations }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }

  // Un code trop court se devine : au moins 6 caractères.
  function codeValide(code){ return typeof code === 'string' && code.trim().length >= 6; }

  // objet → enveloppe (objet JSON prêt à écrire). opts.genereLe : date ISO visible en clair.
  async function chiffrer(objet, code, opts){
    if(!codeValide(code)) throw new Error('Le code doit avoir au moins 6 caractères.');
    const o = opts || {};
    const sel = hasard(16), iv = hasard(12);
    let octets = new TextEncoder().encode(JSON.stringify(objet));
    const compression = gzipConnu() ? 'gzip' : '';
    if(compression) octets = await transformer(octets, racine.CompressionStream);
    const cle = await cleDepuisCode(code, sel, ITERATIONS);
    const chiffre = await subtle().encrypt({ name: 'AES-GCM', iv }, cle, octets);
    return { format: FORMAT, version: VERSION, genereLe: o.genereLe || new Date().toISOString(),
      kdf: { nom: 'PBKDF2-SHA256', iterations: ITERATIONS, sel: versBase64(sel) },
      chiffre: { nom: 'AES-GCM', iv: versBase64(iv) }, compression, donnees: versBase64(chiffre) };
  }

  // enveloppe (objet ou texte JSON) → objet. Lance « Code incorrect » si le code ne va pas.
  async function dechiffrer(enveloppe, code){
    let env = enveloppe;
    if(typeof env === 'string'){
      try{ env = JSON.parse(env); }catch(e){ throw new Error('Fichier illisible : ce n’est pas un envoi du CRM.'); }
    }
    if(!env || env.format !== FORMAT || !env.kdf || !env.chiffre || !env.donnees) throw new Error('Fichier illisible : ce n’est pas un envoi du CRM.');
    if(Number(env.version) > VERSION) throw new Error('Envoi d’une version plus récente du CRM : mets l’application à jour.');
    const iterations = Number(env.kdf.iterations) || ITERATIONS;
    const cle = await cleDepuisCode(String(code || ''), depuisBase64(env.kdf.sel), iterations);
    let octets;
    try{ octets = new Uint8Array(await subtle().decrypt({ name: 'AES-GCM', iv: depuisBase64(env.chiffre.iv) }, cle, depuisBase64(env.donnees))); }
    catch(e){ throw new Error('Code incorrect.'); }
    if(env.compression === 'gzip'){
      if(!gzipConnu()) throw new Error('Ce navigateur ne sait pas lire cet envoi : mets-le à jour.');
      octets = await transformer(octets, racine.DecompressionStream);
    }
    return JSON.parse(new TextDecoder().decode(octets));
  }

  const api = { FORMAT, VERSION, ITERATIONS, codeValide, chiffrer, dechiffrer };
  if(typeof module === 'object' && module.exports) module.exports = api;
  else racine.CoffreGFX = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
  <script>// Moteur de la version téléphone : il monte les méthodes du CRM (mobile/crm-commun.js, extraites
// de « Outil CRM GFX.dc.html ») sur un petit objet qui imite le composant. La lecture des
// dossiers et le calcul de l'agenda sont donc ceux de l'ordinateur, à la ligne près.
//
// Écriture (version 2) : seulement les tâches, dans le _crm.json d'un dossier ou dans
// _taches.json, par les MÊMES opérations que l'ordinateur (tacheBasculee, etapeSuivanteSequence,
// tacheDeplacee… extraites du CRM). Rien n'est conservé dans le stockage du téléphone : les
// données vivent en mémoire, le temps de la session.
(function(racine){
  'use strict';

  function creerMoteur(){
    const m = Object.assign({}, racine.CRM_METHODES, {
      state: { clients: [], tachesSansDossier: [], agendaBlocages: [], reglages: null },

      _messages: [],

      pushToast(message){ this._messages.push(String(message)); },

      async listSubfolder(){ return []; },

  function erreurIntrouvable(nom){ const e = new Error('Introuvable : ' + nom); e.name = 'NotFoundError'; return e; }

  // à jour du fichier est relue juste avant : un changement fait sur l'ordinateur n'est pas perdu.
  async function modifierTaches(m, clientId, fn){

    const t = tasks.find(x => x.id === taskId);
    if(!t) throw new Error('Cette tâche n’existe plus : elle a été modifiée sur un autre appareil.');
    return t;
  };
  // Une tâche de séquence qui a une étape suivante demande d'abord « continuer », « il a répondu »

  function demandeSuite(m, clientId, taskId){

  <script>// Source « envoi de l'ordinateur » de la version téléphone (Thomas, 7-8 oct. 2026).
// Le CRM dépose dans un dossier OneDrive un instantané CHIFFRÉ par le code du conseiller
// (lib/coffre.js). Sur le téléphone, « Mettre à jour » ouvre le sélecteur de fichiers
// (OneDrive y apparaît, sur iPhone comme sur Android) : on choisit le fichier, il est gardé
// TOUJOURS chiffré (IndexedDB) et ouvert en mémoire seulement, avec le code.
// Si le navigateur sait choisir un DOSSIER (Chrome 132+ sur Android, Chrome/Edge sur ordinateur),
// on peut plutôt connecter le dossier une fois : l'application y prend toute seule l'envoi le
// plus récent (Thomas, 8 oct. 2026). Le dossier est mémorisé (IndexedDB), jamais son contenu
// en clair. Rien n'est téléchargé d'Internet, rien n'est publié. Lecture seule.
(function(racine){
  'use strict';
  const BASE = 'gfx-telephone', MAGASIN = 'chiffre', CLE = 'dernier', CLE_DOSSIER = 'dossier';
  const MAX_FICHIERS = 40, MAX_TAILLE = 30 * 1024 * 1024;

  // Actif dans l'application installée (window.GFXM_PUBLICATION, inscrit par
  // mobile/construire-site.js) ou quand les tests l'allument.
  const actif = () => !!(racine.GFXM_PUBLICATION || racine.GFXM_PUBLICATION_TEST);

  function base(){
    return new Promise((ok, ko) => {
      if(!racine.indexedDB){ ko(new Error('Ce navigateur ne peut pas garder l’envoi.')); return; }
      const r = racine.indexedDB.open(BASE, 1);
      r.onupgradeneeded = () => { r.result.createObjectStore(MAGASIN); };
      r.onsuccess = () => ok(r.result);
      r.onerror = () => ko(r.error);
    });
  }
  async function transaction(mode, fn){
    const db = await base();
    try{
      return await new Promise((ok, ko) => {
        const tx = db.transaction(MAGASIN, mode), st = tx.objectStore(MAGASIN);
        let res;
        Promise.resolve(fn(st, (v) => { res = v; })).catch(ko);
        tx.oncomplete = () => ok(res);
        tx.onerror = () => ko(tx.error);
      });
    }finally{ db.close(); }
  }
  // Un envoi du CRM, et seulement ça : on refuse tout autre fichier (jamais de texte en clair).
  function verifier(texte){
    let env;
    try{ env = JSON.parse(texte); }catch(e){ throw new Error('Ce fichier n’est pas un envoi du CRM.'); }
    if(!env || env.format !== 'gfx-telephone' || !env.donnees || !env.chiffre || !env.kdf) throw new Error('Ce fichier n’est pas un envoi du CRM. Choisis « CRM GFX - telephone.json ».');
    return env;
  }
  // Parmi plusieurs textes, l'envoi du CRM le plus récent (date d'envoi, sinon date du fichier).
  function plusRecent(candidats){
    let meilleur = null;
    candidats.forEach(c => {
      let env = null;
      try{ env = verifier(c.texte); }catch(e){ return; }
      const cle = String(env.genereLe || '') + '|' + String(c.modifie || 0).padStart(15, '0');
      if(!meilleur || cle > meilleur.cle) meilleur = { ...c, cle, genereLe: env.genereLe || '' };
    });
    return meilleur;
  }
  // Un texte, un fichier ou PLUSIEURS fichiers : on garde l'envoi le plus récent.
  async function importer(source){
    let texte;
    if(typeof source === 'string') texte = source;
    else if(source && typeof source.length === 'number' && !source.text){
      const candidats = [];
      for(const f of Array.from(source).slice(0, MAX_FICHIERS)){ if(f.size <= MAX_TAILLE) candidats.push({ texte: await f.text(), modifie: f.lastModified || 0 }); }
      const m = plusRecent(candidats);
      if(!m) throw new Error('Aucun de ces fichiers n’est un envoi du CRM. Choisis « CRM GFX - telephone.json ».');
      texte = m.texte;
    }
    else texte = await source.text();
    verifier(texte);
    await transaction('readwrite', (st) => { st.put(texte, CLE); });
    return texte;
  }

  // ---- Dossier connecté (une seule fois) ----------------------------------------------------
  const dossierPossible = () => typeof racine.showDirectoryPicker === 'function';
  // Tests : GFXM_DOSSIER_TEST remplace le dossier mémorisé (un faux dossier ne se range pas dans IndexedDB).
  const enTest = () => racine.GFXM_DOSSIER_TEST !== undefined;
  async function dossierConnecte(){
    if(enTest()) return racine.GFXM_DOSSIER_TEST;
    try{ return await transaction('readonly', (st, rendre) => { const q = st.get(CLE_DOSSIER); q.onsuccess = () => rendre(q.result || null); }) || null; }
    catch(e){ return null; }
  }
  async function connecterDossier(){
    if(!dossierPossible()) throw new Error('Ce navigateur ne sait pas ouvrir un dossier : importe le fichier.');
    // En écriture : les gestes faits ici (créer, cocher, déplacer) y partent vers l'ordinateur.
    const h = await racine.showDirectoryPicker({ id: 'gfx-envoi', mode: 'readwrite' });
    if(enTest()){ racine.GFXM_DOSSIER_TEST = h; return h; }
    await transaction('readwrite', (st) => { st.put(h, CLE_DOSSIER); });
    return h;
  }
  async function oublierDossier(){ if(enTest()){ racine.GFXM_DOSSIER_TEST = null; return; } try{ await transaction('readwrite', (st) => { st.delete(CLE_DOSSIER); }); }catch(e){} }
  // Le plus récent envoi du dossier. demander : true seulement après un geste (toucher un bouton),
  // parce que le navigateur ne redemande la permission qu'à ce moment-là.
  // Retour : { etat: 'aucun-dossier' | 'autorisation' | 'vide' | 'importe', texte, nom }.
  async function actualiserDepuisDossier(opts){
    const o = opts || {};
    const h = await dossierConnecte();
    if(!h) return { etat: 'aucun-dossier' };
    let perm = h.queryPermission ? await h.queryPermission({ mode: 'read' }) : 'granted';
    if(perm !== 'granted' && o.demander && h.requestPermission) perm = await h.requestPermission({ mode: 'read' });
    if(perm !== 'granted') return { etat: 'autorisation', nom: h.name };
    const candidats = [];
    for await (const [nom, e] of h.entries()){
      if(candidats.length >= MAX_FICHIERS) break;
      if(!e || e.kind !== 'file' || !/\.json$/i.test(nom)) continue;
      const f = await e.getFile();
      if(f.size > MAX_TAILLE) continue;
      candidats.push({ texte: await f.text(), modifie: f.lastModified || 0, nom });
    }
    const m = plusRecent(candidats);
    if(!m) return { etat: 'vide', nom: h.name };
    const actuel = await copieLocale();
    if(actuel !== m.texte){ verifier(m.texte); await transaction('readwrite', (st) => { st.put(m.texte, CLE); }); }

  }
  // Écrit un fichier dans le dossier connecté. demander : après un toucher seulement.
  async function ecrireDansDossier(nom, texte, demander){

    let perm = h.queryPermission ? await h.queryPermission({ mode: 'readwrite' }) : 'granted';
    if(perm !== 'granted' && demander && h.requestPermission) perm = await h.requestPermission({ mode: 'readwrite' });
    if(perm !== 'granted') return false;
    const f = await h.getFileHandle(nom, { create: true });
    const w = await f.createWritable();
    await w.write(texte);
    await w.close();
    return true;
  }
  // File des gestes pas encore confirmés par l'ordinateur : TOUJOURS chiffrée (même code).
  async function garderGestes(texte){
    try{ await transaction('readwrite', (st) => { if(texte) st.put(texte, 'gestes'); else st.delete('gestes'); }); }catch(e){}
  }
  async function gestesGardes(){
    try{ return await transaction('readonly', (st, rendre) => { const q = st.get('gestes'); q.onsuccess = () => rendre(q.result || ''); }) || ''; }
    catch(e){ return ''; }
  }
  async function copieLocale(){
    try{ return await transaction('readonly', (st, rendre) => { const q = st.get(CLE); q.onsuccess = () => rendre(q.result || ''); }) || ''; }
    catch(e){ return ''; }
  }
  async function oublier(){ try{ await transaction('readwrite', (st) => { st.delete(CLE); }); }catch(e){} }
  async function lire(){
    const texte = await copieLocale();
    if(!texte) throw new Error('Aucun envoi importé : touche « Mettre à jour » et choisis le fichier dans OneDrive.');
    return { texte, horsLigne: false };
  }
  // Date d'envoi, lisible sans le code (seule information en clair du fichier).
  function dateEnvoi(texte){ try{ return JSON.parse(texte).genereLe || ''; }catch(e){ return ''; } }

  racine.PublicationMobile = { actif, importer, lire, oublier, dateEnvoi, copieLocale,
    dossierPossible, dossierConnecte, connecterDossier, oublierDossier, actualiserDepuisDossier,
    ecrireDansDossier, garderGestes, gestesGardes, FICHIER_GESTES: 'CRM GFX - gestes telephone.json' };
})(window);

  // ---- Chargement ------------------------------------------------------------------------

  // Envoi de l'ordinateur : importé depuis OneDrive (sélecteur de fichiers du téléphone), gardé

  function choisirFichier(){ const f = $('fichier-envoi'); if(f){ f.value = ''; f.click(); } }
  // Dossier connecté : l'envoi le plus récent, pris tout seul. demander = après un toucher.
  async function actualiserEnvoi(demander, sansRendu){
    let r;
    try{ r = await PUB.actualiserDepuisDossier({ demander }); }
    catch(e){ app.erreur = e && e.message ? e.message : String(e); if(!sansRendu) rendre(); return false; }
    app.dossierAutorisation = r.etat === 'autorisation';

    if(r.etat === 'importe'){
      app.copieEnvoi = PUB.dateEnvoi(r.texte) || '?';
      if(codeOuvert && (r.nouveau || !app.charge)) return ouvrirPublication(codeOuvert, true);

  async function connecterDossierEnvoi(){

  // ↻ et « Mettre à jour » : le dossier connecté s'il y en a un, sinon le sélecteur de fichiers.
  function mettreAJourEnvoi(){

  async function ouvrirPublication(code, silencieux){

  // « aujourd’hui à 17 h 42 », « hier à … », sinon la date.
  function quand(iso){
    const d = new Date(iso);
    if(!iso || isNaN(d)) return '';
    const jour = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const h = heureLisible(String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'));
    return (jour === todayIso() ? 'aujourd’hui' : jour === addDays(todayIso(), -1) ? 'hier' : jourCourt(jour)) + ' à ' + h;
  }
  function actualiser(){
    if(app.source === 'publication') mettreAJourEnvoi();

  // ---- Gestes en mode « envoi de l'ordinateur » (Thomas, 8 oct. 2026) -------------------------
  // Le geste est appliqué ici tout de suite (appliquerGesteTache, la fonction du CRM), gardé
  // chiffré dans la file, puis envoyé à l'ordinateur : écrit dans le dossier OneDrive connecté
  // (Android), sinon par le bouton « Envoyer à l'ordinateur » (menu Partager, iPhone). Il quitte
  // la file quand l'envoi suivant de l'ordinateur dit l'avoir appliqué.
  let gestes = [], texteGestes = '';
  const nouvelIdGeste = () => 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  function opDepuis(nom, args){
    const op = { id: nouvelIdGeste(), clientId: args[0], at: new Date().toISOString() };
    if(nom === 'creer') return { ...op, type: 'creer', tache: args[1] };
    if(nom === 'deplacer') return { ...op, type: 'deplacer', taskId: args[1], date: args[2], heure: args[3] || '' };
    if(nom === 'liberer') return { ...op, type: 'liberer', taskId: args[1] };
    // Produits (Thomas, 9 oct. 2026) : créer ou modifier une recommandation, un statut, une commission.
    if(nom === 'police-creer') return { ...op, type: 'police-creer', police: args[1] };
    if(nom === 'police-modifier') return { ...op, type: 'police-modifier', policeId: args[1], champs: args[2] };
    if(nom === 'cocher'){
      const { t } = trouverTache(args[0], args[1]);
      return { ...op, type: 'faite', taskId: args[1], fait: !(t && t.fait), suite: args[2] || '', faitLe: todayIso(), faitA: heureCouranteHHMM() };
    }
    throw new Error('Geste inconnu');
  }
  // Applique un geste à l'agenda du téléphone (mêmes règles que l'ordinateur).
  function appliquerIci(op){
    const sans = op.clientId === TACHES_SANS_DOSSIER_ID;
    const c = sans ? null : (m.state.clients || []).find(x => x.id === op.clientId);
    if(!sans && !c) throw new Error('Dossier introuvable sur le téléphone.');
    const r = appliquerGesteTache(m.agendaActif(), sans ? m.state.tachesSansDossier : c.tasks, c, op, sans);
    if(!r) return null;
    if(sans) m.state = { ...m.state, tachesSansDossier: r.tasks };
    else m.state = { ...m.state, clients: m.state.clients.map(x => x.id === c.id ? { ...x, tasks: r.tasks, ...(r.patch || {}) } : x) };
    m._memoStore = {};
    return r;
  }
  async function garderGestes(){
    texteGestes = gestes.length && codeOuvert ? JSON.stringify(await COFFRE.chiffrer({ format: 'gfx-telephone-gestes', version: 1, ops: gestes }, codeOuvert)) : '';
    await PUB.garderGestes(texteGestes);
  }
  // Après chaque envoi de l'ordinateur : on retire ce qu'il a appliqué, on réapplique le reste.
  async function reprendreGestes(appliques){
    if(!gestes.length){
      const t = await PUB.gestesGardes();
      if(t){ try{ const d = await COFFRE.dechiffrer(t, codeOuvert); gestes = Array.isArray(d.ops) ? d.ops : []; }catch(e){ gestes = []; } }
    }
    const faits = new Set(appliques || []);
    gestes = gestes.filter(g => !faits.has(g.id));
    gestes.forEach(g => { try{ appliquerIci(g); }catch(e){} });
    await garderGestes();
    if(gestes.length && app.dossierEnvoi) await envoyerGestes(false);
  }
  // Partager le fichier (menu Partager du téléphone : « Enregistrer dans Fichiers » › OneDrive).
  async function partagerGestes(){
    if(!texteGestes) return false;
    const nom = 'CRM GFX - gestes ' + new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-') + '.json';
    const f = new File([texteGestes], nom, { type: 'application/json' });
    if(navigator.canShare && navigator.canShare({ files: [f] })){
      try{ await navigator.share({ files: [f], title: 'CRM GFX' }); return true; }catch(e){ return false; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(f); a.download = nom; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
    return true;
  }
  // Toujours toute la file (l'ordinateur ignore ce qu'il a déjà appliqué). manuel : après un toucher.
  async function envoyerGestes(manuel){
    if(!gestes.length || !texteGestes) return true;
    let ok = false;
    if(app.dossierEnvoi){ try{ ok = await PUB.ecrireDansDossier(PUB.FICHIER_GESTES, texteGestes, manuel); }catch(e){ ok = false; } }
    app.envoiAuto = ok;
    if(!ok && manuel) ok = await partagerGestes();
    if(ok) gestes.forEach(g => { g.envoye = true; });
    return ok;
  }
  async function gesteTelephone(nom, ...args){
    if(app.ecriture) return null;
    app.ecriture = true; rendreMessage();
    try{
      const op = opDepuis(nom, args);
      const r = appliquerIci(op);
      app.feuille = null;
      if(!r){ annoncer('Rien à changer'); return null; }
      gestes.push(op);
      await garderGestes();
      const parti = await envoyerGestes(false);
      annoncer(r.message + (parti ? ' — envoyé à l’ordinateur' : ' — à envoyer à l’ordinateur'));
      return r;
    }catch(e){
      if(e && e.suiteRequise){ ouvrirSuite(args[0], args[1]); return null; }
      app.erreur = e && e.message ? e.message : String(e);
      return null;
    }finally{ app.ecriture = false; rendre(); }
  }
  // Bandeau : ce qui attend l'ordinateur.
  function bandeauGestes(){
    if(app.source !== 'publication' || !gestes.length) return '';

    return '<div class="bandeau-gestes" style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;padding:9px 12px;border-radius:10px;border:1px solid rgba(201,162,75,.6);background:rgba(201,162,75,.12);">'
      + '<span>📤 ' + n + ' changement' + (n > 1 ? 's' : '') + (auto ? ' envoyé' + (n > 1 ? 's' : '') + ' : l’ordinateur les prendra à sa prochaine minute' : ' à envoyer à l’ordinateur') + '</span>'
      + (auto ? '' : '<button class="bouton or" data-action="envoyer-gestes">Envoyer</button>') + '</div>';
  }

  // ---- Gestes : créer, déplacer, cocher (écriture) ----------------------------------------
  async function geste(nom, ...args){
    if(app.source === 'publication') return gesteTelephone(nom, ...args);
    // Les produits ne se modifient qu'avec l'envoi de l'ordinateur (et en démo, sur le téléphone seulement).
    if(/^police-/.test(nom)){
      if(app.source !== 'demo'){ annoncer('Les produits se modifient avec l’envoi de l’ordinateur.'); return null; }
      try{ const r = appliquerIci(opDepuis(nom, args)); app.feuille = null; annoncer(r ? r.message + ' (démo)' : 'Rien à changer'); return r; }
      catch(e){ app.erreur = e && e.message ? e.message : String(e); return null; }
      finally{ rendre(); }
    }
    if(!peutEcrire()){ annoncer('Connecte-toi pour modifier.'); return null; }
    if(app.ecriture) return null;
    app.ecriture = true; rendreMessage();
    try{
      const r = await M[nom](m, ...args);
      app.feuille = null;
      annoncer(r && r.message ? r.message + (app.source === 'onedrive' ? ' — enregistré dans OneDrive' : ' (démo)') : 'Rien à changer');
      return r;
    }catch(e){
      if(e && e.suiteRequise){ ouvrirSuite(args[0], args[1]); return null; }
      app.erreur = e && e.message ? e.message : String(e);
      return null;
    }finally{ app.ecriture = false; rendre(); }
  }
  function cocher(clientId, taskId, deja){
    const s = !deja && M.demandeSuite(m, clientId, taskId);

  }
  function ouvrirSuite(clientId, taskId){
    const s = M.demandeSuite(m, clientId, taskId);

  }

  // ---- Sécurité : verrouillage après inactivité -------------------------------------------
  function verrouiller(raison){
    M.vider(m); lecteur = null; codeOuvert = null; gestes = []; texteGestes = ''; OD.deconnecter();
    app.charge = false; app.fiche = null; app.moi = null; app.navigation = null; app.feuille = null;
    $('verrou-texte').textContent = raison || ('Après ' + delaiVerrou() + ' minutes sans activité, les données sont effacées du téléphone.');
    $('verrou').hidden = false;

  }
  function verifierInactivite(){
    if(app.charge && Date.now() - derniereActivite > delaiVerrou() * 60000) verrouiller();
  }
  ['click', 'touchstart', 'keydown', 'scroll'].forEach(ev => document.addEventListener(ev, () => { derniereActivite = Date.now(); }, { passive: true }));
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') verifierInactivite(); });
  setInterval(verifierInactivite, 15000);
  // Mise à jour automatique : toutes les 90 secondes quand l'application est à l'écran.
  setInterval(() => {
    if(document.visibilityState === 'visible' && app.source === 'onedrive' && app.charge && !app.chargement && !app.ecriture && OD.estConnecte()) chargerOneDrive(true);

  // ---- Filtres (mêmes règles que l'agenda de l'ordinateur) --------------------------------
  function htmlFiltres(liste){

      h += '<div class="resume-filtre" role="status"><span>Filtre : ' + esc(lib) + ' — ' + n + ' sur ' + liste.length + '</span><button data-action="effacer-filtres">✕ Tout afficher</button></div>';

  const boutonFiltres = () => '<button class="filtres-bouton' + (filtreActif() ? ' actif' : '') + '" data-action="ouvrir-filtres" aria-expanded="' + app.filtresOuverts + '">⚙︎ Filtrer</button>';

  // ---- Agenda façon Google Agenda (vues du module commun lib/calendrier.js) ---------------
  // Sans place ce jour-là : « à reporter », et les tâches pas faites à l'heure prévue qui n'ont
  // plus de place aujourd'hui (le soir, elles restent visibles, marquées ⚠ « Pas faite »).
  function sansPlaceDu(p){
    if(p.passe) return [];
    const vues = new Set(p.taches.map(x => (x.clientId || '') + '|' + x.tache.id));
    const l = p.aReporter.filter(x => !x.virtuel);
    (p.manquees || []).forEach(x => {
      const k = (x.clientId || '') + '|' + x.tache.id;

  function infoEvt(x, p, extra){

    const vue = VUES_TEL.indexOf(app.vue) !== -1 ? app.vue : 'planning';

      + '<div class="ligne-outils"><div class="segment segment-vues" role="group" aria-label="Vue">'

  // Conformité : jamais placée dans l'agenda (mêmes règles que l'ordinateur, tachesConformite),
  // toujours visible ici jusqu'à ce qu'elle soit faite.
  function blocConformite(){

  function vuePlanning(){

        p.taches.filter(x => !x.virtuel && garder(x)).forEach(x => lignes.push({ tri: x.debutMin, heures: (x.pasFaite ? '⚠ ' : '') + (x.rdv || x.manuel ? CAL.EPINGLE + ' ' : '') + CAL.heureLisible(x.debutMin) + ' – ' + CAL.heureLisible(x.debutMin + x.dureeMin), x, p }));
        sansPlaceDu(p).filter(garder).forEach(x => {
          // Une tâche à heure voulue garde son heure, même sans place ou pas faite.

        });
        if(!filtreActif()) p.blocages.forEach(b => lignes.push({ tri: b.journee ? -2 : b.deMin, heures: b.journee ? 'Journée' : heureLisible(b.de) + ' – ' + heureLisible(b.a), b, p }));

  function vueGrille(vue){
    const jours = CAL.joursAffiches(vue, app.date), plans = jours.map(d => m.planAgenda(d));
    const PX = vue === 'semaine' ? 0.8 : 1;   // pixels par minute
    let de = 8 * 60, a = 18 * 60;
    plans.forEach(p => { p.plages.forEach(pl => { de = Math.min(de, pl.deMin); a = Math.max(a, pl.aMin); }); p.taches.forEach(x => { de = Math.min(de, x.debutMin); a = Math.max(a, x.debutMin + x.dureeMin); }); });
    de = Math.floor(de / 60) * 60; a = Math.min(24 * 60, Math.ceil(a / 60) * 60);
    const H = Math.round((a - de) * PX), y = (min) => Math.round((min - de) * PX), auj = todayIso(), now = maintenantMin();
    const toutes = [].concat(...plans.map(tachesDu));
    let h = htmlFiltres(toutes);
    const cols = 'grid-template-columns:38px repeat(' + jours.length + ',minmax(0,1fr));';
    h += '<div class="grille-tel" data-de="' + de + '" data-a="' + a + '"><div class="g-entete" style="' + cols + '"><span></span>' + jours.map(d => {
      const e = CAL.enteteJour(d);
      return '<span class="g-jour" data-action="ouvrir-jour" data-date="' + d + '"><small>' + esc(e.court) + '</small><b class="' + (d === auj ? 'auj' : '') + '">' + e.numero + '</b></span>';
    }).join('') + '</div>';
    // Rangée « Journée » : sans place, et journées bloquées.
    const journees = plans.map(p => sansPlaceDu(p).filter(garder));
    if(journees.some(l => l.length)) h += '<div class="g-journee" style="' + cols + '"><span class="g-lib">Journée</span>' + journees.map((l, i) => '<span class="g-jcel">'
      + l.slice(0, 2).map(x => '<span class="g-jevt" style="border-left-color:' + esc(couleurDe(x, plans[i])) + '"' + evtAttr(infoEvt(x, plans[i], { sansPlace: true })) + '>' + (x.manquee ? '⚠ ' : '') + esc(CAL.prefixeFixe(CAL.heureVoulue(x.tache)) + x.tache.texte) + '</span>').join('')
      + (l.length > 2 ? '<span class="g-jplus" data-action="ouvrir-jour" data-date="' + plans[i].date + '">+ ' + (l.length - 2) + '</span>' : '') + '</span>').join('') + '</div>';
    h += '<div class="g-corps" style="' + cols + '"><div class="g-heures" style="height:' + H + 'px">';
    for(let min = de + 60; min < a; min += 60) h += '<span style="top:' + (y(min) - 6) + 'px">' + esc(CAL.heureLisible(min)) + '</span>';
    h += '</div>';
    plans.forEach(p => {
      const items = [];
      if(!p.passe) p.taches.filter(garder).forEach(x => items.push({ x, deMin: x.debutMin, finMin: x.debutMin + x.dureeMin }));
      else p.faites.filter(x => x.debutMin != null && garder(x)).forEach(x => items.push({ x, deMin: x.debutMin, finMin: x.debutMin + (x.dureeMin || 15), faite: true }));
      if(!filtreActif()) p.blocages.filter(b => !b.journee).forEach(b => items.push({ b, deMin: b.deMin, finMin: b.aMin }));
      CAL.disposer(items, 20 / PX);
      h += '<div class="g-col" data-action="case" data-date="' + p.date + '" style="height:' + H + 'px;background-size:100% ' + Math.round(60 * PX) + 'px">';
      p.plages.forEach(pl => { h += '<div class="g-bande" style="top:' + y(pl.deMin) + 'px;height:' + Math.max(2, Math.round((pl.aMin - pl.deMin) * PX)) + 'px;background:' + CAL.teinte(pl.type.couleur, .1) + ';border-left-color:' + CAL.teinte(pl.type.couleur, .55) + '"></div>'; });
      if(p.date < auj || p.date === auj) h += '<div class="g-passe" style="height:' + (p.date < auj ? H : Math.max(0, Math.min(H, y(now)))) + 'px"></div>';
      items.forEach(it => {
        const larg = 100 / it.nbVoies, haut = Math.max(18, Math.round((it.finMin - it.deMin) * PX) - 2);
        const pos = 'top:' + y(it.deMin) + 'px;height:' + haut + 'px;left:calc(' + (it.voie * larg) + '% + 1px);width:calc(' + larg + '% - 3px);';
        if(it.b){ h += '<div class="g-evt bloque" style="' + pos + '"' + evtAttr({ genre: 'blocage', id: it.b.id, date: p.date }) + '>' + (haut >= 34 ? '' : esc(CAL.prefixeHeure(it.deMin))) + '🔒 ' + esc(it.b.titre || 'Occupé') + '</div>'; return; }
        const x = it.x, coul = couleurDe(x, p), fixe = !!(x.rdv || x.manuel);
        const passee = !it.faite && p.date === auj && x.debutMin + x.dureeMin <= now, pasFaite = !it.faite && !!x.pasFaite;
        h += '<div class="g-evt' + (fixe ? ' fixe' : ' auto') + (it.faite ? ' faite' : '') + (passee ? ' passee' : '') + '" style="' + pos + (it.faite ? 'border-left-color:' + esc(coul) : 'background:' + esc(coul)) + (fixe && !it.faite ? ';outline:2px solid #C9A24B;outline-offset:-2px;font-weight:700' : '') + (pasFaite ? ';box-shadow:inset 4px 0 0 #D93025;opacity:.92' : '') + '"' + evtAttr(infoEvt(x, p)) + '>'
          + '<b>' + esc((pasFaite ? '⚠ ' : '') + (fixe && !it.faite ? CAL.prefixeFixe(x.debutMin) : haut >= 34 ? '' : CAL.prefixeHeure(x.debutMin)) + (x.client && !x.client._sansDossier ? x.client.nom + ' · ' : '') + x.tache.texte) + '</b>' + (haut >= 34 ? '<small>' + esc(CAL.heureLisible(x.debutMin) + ' – ' + CAL.heureLisible(x.debutMin + (x.dureeMin || 15))) + '</small>' : '') + '</div>';
      });
      if(p.date === auj && now >= de && now <= a) h += '<div class="g-maintenant" style="top:' + y(now) + 'px"></div>';
      h += '</div>';
    });
    return h + '</div></div>';
  }

      + '<p class="note"><button class="bouton second" data-action="demo">Voir la démo</button></p></div>';
    return '<div class="bloc code-ouverture"><h3>🔒 Ton agenda</h3><p class="note">Envoi de l’ordinateur : <strong>' + esc(quand(app.copieEnvoi)) + '</strong>. Entre le code choisi dans le CRM (Réglages › 📱 Téléphone) : une seule fois, le téléphone s’en souviendra.</p>'
      + '<input class="champ-saisie" id="code-ouverture" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" aria-label="Code">'
      + '<p><button class="bouton or" data-action="ouvrir-code">Ouvrir</button> '
      + (app.dossierEnvoi ? '' : '<button class="bouton second" data-action="importer">📥 Importer un envoi plus récent</button>') + '</p>'
      + (app.dossierEnvoi ? '<p class="note">📁 ' + esc(app.dossierEnvoi) + (app.dossierAutorisation ? ' — le téléphone redemandera l’accès au dossier en ouvrant.' : ' — l’envoi le plus récent est pris tout seul.') + '</p>' : '')
      + '</div>';
  }

  // ---- Rendu -------------------------------------------------------------------------------
  const TITRES = { agenda: 'Agenda', taches: 'Tâches', clients: 'Clients', reglages: 'Réglages' };
  function rendreMessage(){
    const el = $('message');
    if(!el) return;
    el.textContent = app.ecriture ? 'Enregistrement…' : app.message;
    el.hidden = !(app.ecriture || app.message);
  }
  function rendre(){
    document.querySelectorAll('.onglets button').forEach(b => { if(b.dataset.onglet === app.onglet) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    $('titre').textContent = app.onglet === 'clients' && app.fiche ? 'Fiche client' : TITRES[app.onglet];
    const st = $('statut');
    st.className = 'statut' + (app.erreur ? ' erreur' : '');
    st.innerHTML = app.erreur ? '⚠ ' + esc(app.erreur) + ' <button class="effacer-erreur" data-action="effacer-erreur" aria-label="Fermer">✕</button>'
      : app.chargement ? esc(app.chargement)
      : app.source === 'demo' ? '<span class="pastille">DÉMO</span> Dossiers fictifs · rien n’est envoyé'
      : app.source === 'onedrive' && app.charge ? '<span class="pastille">OneDrive</span> À jour à ' + new Date(app.dernierChargement).toLocaleTimeString('fr-CA', { hour: '2-digit', minute: '2-digit' })
      : app.source === 'publication' && app.charge ? '<span class="pastille">Ordinateur</span> Envoi ' + esc(quand(app.envoyeLe)) + (String(app.envoyeLe).slice(0, 10) < todayIso() ? ' · ↻ pour mettre à jour' : '')
      : PUB.actif() ? (app.copieEnvoi ? 'Entre ton code pour ouvrir ton agenda.' : 'Importe l’envoi de ton ordinateur, depuis OneDrive.')
      : 'Pas de données : ouvre la démo ou connecte OneDrive dans Réglages.';
    $('actualiser').hidden = !app.charge;
    let h;
    if(app.onglet === 'reglages') h = ecranReglages();
    else if(!app.charge) h = app.chargement ? '<div class="vide">' + esc(app.chargement) + '</div>'
      : PUB.actif() && app.source !== 'demo' ? ecranCode()
      : '<div class="vide">Aucune donnée ouverte.<br><br><button class="bouton" data-action="aller-reglages">Ouvrir les réglages</button> <button class="bouton second" data-action="demo">Voir la démo</button></div>';
    else if(app.onglet === 'agenda') h = ecranAgenda();
    else if(app.onglet === 'taches') h = ecranTaches();
    else h = ecranClients();
    $('ecran').innerHTML = h;
    $('feuille').innerHTML = app.charge ? htmlFeuille() : '';
    rendreMessage();
  }

  // ---- Actions -------------------------------------------------------------------------------
  const valeurDe = (id) => { const el = $(id); return el ? el.value : ''; };
  document.addEventListener('click', async (ev) => {
    const ong = ev.target.closest('[data-onglet]');
    if(ong){ app.onglet = ong.dataset.onglet; app.fiche = null; app.retourFiche = null; app.feuille = null; window.scrollTo(0, 0); rendre(); return; }
    const el = ev.target.closest('[data-action]');
    if(!el) return;
    const a = el.dataset.action;
    if(a === 'vue'){ app.vue = el.dataset.vue; app.planningJours = CAL.PLANNING_JOURS; }
    else if(a === 'decaler'){ const v = VUES_TEL.indexOf(app.vue) !== -1 ? app.vue : 'planning'; app.date = v === 'planning' ? addDays(app.date, 7 * Number(el.dataset.n)) : CAL.decaler(v, app.date, Number(el.dataset.n)); }
    else if(a === 'aujourdhui'){ app.date = todayIso(); }
    else if(a === 'ouvrir-jour'){ app.date = el.dataset.date; app.vue = 'jour'; }
    else if(a === 'planning-plus'){ app.planningJours = Math.min(60, app.planningJours + 14); }
    else if(a === 'ouvrir-filtres'){ app.filtresOuverts = !app.filtresOuverts; }
    else if(a === 'filtre'){ const t = el.dataset.type, v = el.dataset.valeur; app.filtre[t] = app.filtre[t] === v ? '' : v; }
    else if(a === 'effacer-filtres'){ app.filtre = { categorie: '', sequence: '' }; }
    else if(a === 'groupe'){ app.groupe = el.dataset.groupe; }
    else if(a === 'effacer-erreur'){ app.erreur = ''; }
    else if(a === 'evenement'){ try{ app.feuille = { type: 'evenement', ...JSON.parse(el.dataset.info) }; }catch(e){} }
    else if(a === 'case'){
      // Toucher une case vide de la grille : créer à l'heure touchée (au quart d'heure).
      if(!peutEcrire() || ev.target !== el) return;
      const g = el.closest('.grille-tel'), r = el.getBoundingClientRect();
      const min = CAL.minuteAuClic(ev.clientY - r.top, r.height, Number(g.dataset.de), Number(g.dataset.a), 15);
      ouvrirCreation(el.dataset.date, CAL.hhmm(min)); return;
    }
    else if(a === 'creer'){ ouvrirCreation(app.vue === 'planning' && app.date < todayIso() ? todayIso() : app.date); return; }
    else if(a === 'creer-pour'){ ouvrirCreation(todayIso()); app.feuille.client = el.dataset.nom; rendre(); return; }
    else if(a === 'fermer-feuille'){ app.feuille = null; }
    else if(a === 'cocher'){
      ev.stopPropagation();
      const clientId = el.dataset.client, taskId = el.dataset.tache;
      app.feuille = null; cocher(clientId, taskId, el.dataset.fait === '1'); return;
    }
    else if(a === 'suite'){ const f = app.feuille; geste('cocher', f.clientId, f.taskId, el.dataset.suite); return; }
    else if(a === 'deplacer'){
      const f = app.feuille, { t } = trouverTache(f.clientId, f.taskId);
      const heure = hhmmValide(t && t.heure) || (t && t.planFixe ? t.planHeure : '') || (f.debutMin != null && !f.sansPlace ? CAL.hhmm(f.debutMin) : '');
      app.feuille = { type: 'deplacer', clientId: f.clientId, taskId: f.taskId, date: f.date, heure, fixe: !!heure };
    }
    else if(a === 'fixer'){ const f = app.feuille; geste('deplacer', f.clientId, f.taskId, f.date, CAL.hhmm(f.debutMin)); return; }
    else if(a === 'liberer'){ const f = app.feuille; geste('liberer', f.clientId, f.taskId); return; }
    else if(a === 'enregistrer-deplacement'){
      const f = app.feuille, date = valeurDe('f-date'), fixe = $('f-fixe').checked, heure = fixe ? valeurDe('f-heure') : '';
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ annoncer('Choisis une date.'); return; }
      if(fixe && !hhmmValide(heure)){ annoncer('Choisis une heure, ou décoche « Heure fixe ».'); return; }
      const { t } = trouverTache(f.clientId, f.taskId);
      // Sans heure fixe : la tâche perd une heure fixée à la main et l'agenda la range ce jour-là.
      if(!fixe && t && t.planFixe){ await geste('liberer', f.clientId, f.taskId); }
      geste('deplacer', f.clientId, f.taskId, date, heure); return;
    }
    else if(a === 'enregistrer-creation'){
      const texte = valeurDe('f-texte').trim(), nom = valeurDe('f-client').trim().toLowerCase(), date = valeurDe('f-date'), fixe = $('f-fixe').checked, heure = valeurDe('f-heure');
      if(!texte){ annoncer('Donne un titre à la tâche.'); return; }
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ annoncer('Choisis une date.'); return; }
      let cible = TACHES_SANS_DOSSIER_ID;
      if(nom){ const c = (m.state.clients || []).find(x => !x.archive && String(x.nom || '').toLowerCase() === nom); if(!c){ annoncer('Dossier introuvable : choisis un nom dans la liste.'); return; } cible = c.id; }
      const tache = { id: 't' + Date.now(), texte, description: '', categorie: valeurDe('f-type'), echeance: date, echeanceFin: date, fait: false,
        dureeMin: Number(valeurDe('f-duree')) || 30, ...(fixe && hhmmValide(heure) ? { heure } : {}) };
      geste('creer', cible, tache); return;
    }
    else if(a === 'police'){ app.feuille = { type: 'police', clientId: app.fiche, policeId: el.dataset.id }; }
    else if(a === 'police-nouveau'){ app.feuille = { type: 'police', clientId: app.fiche, policeId: '' }; }
    else if(a === 'enregistrer-police'){
      const f = app.feuille, c = (m.state.clients || []).find(x => x.id === f.clientId);
      const p = c && f.policeId ? (c.polices || []).find(x => x.id === f.policeId) : null;
      const lu = (id) => String(valeurDe(id)).replace(/\s/g, '').replace(',', '.');
      const champs = { produit: valeurDe('f-produit'), statut: valeurDe('f-statut'), compagnie: valeurDe('f-compagnie').trim(),
        couverture: lu('f-couverture') || 0, primeMensuelle: lu('f-prime') || 0, commissionRecue: !!($('f-recue') || {}).checked, dateVente: valeurDe('f-vente') };
      const comm = lu('f-commission');
      if(!p){ if(comm !== '') champs.commission = comm; geste('police-creer', f.clientId, { id: 'p' + Date.now().toString(36), ...champs }); return; }
      // On n'envoie que ce qui a changé : une prime changée réestime la commission si elle n'a jamais été saisie.
      const avant = { produit: p.produit, statut: p.statut, compagnie: p.compagnie || '', couverture: Number(p.couverture) || 0, primeMensuelle: Number(primeMensuellePolice(p)) || 0, commissionRecue: !!p.commissionRecue, dateVente: p.dateVente || '' };
      const diff = {};
      Object.keys(champs).forEach(k => { const a2 = champs[k], b2 = avant[k]; if(typeof b2 === 'number' ? Number(a2) !== b2 : a2 !== b2) diff[k] = a2; });
      if(comm !== '' && Number(comm) !== (Number(p.commission) || 0)) diff.commission = comm;
      geste('police-modifier', f.clientId, p.id, diff); return;
    }
    else if(a === 'fiche'){ app.retourFiche = app.onglet; app.fiche = el.dataset.id; app.onglet = 'clients'; app.feuille = null; window.scrollTo(0, 0); }
    else if(a === 'retour'){ const r = app.retourFiche; app.fiche = null; app.onglet = r && r !== 'clients' ? r : 'clients'; app.retourFiche = null; }
    else if(a === 'aller-reglages'){ app.onglet = 'reglages'; }
    else if(a === 'demo'){ app.onglet = 'agenda'; ouvrirDemo(); return; }
    else if(a === 'importer'){ choisirFichier(); return; }
    else if(a === 'contacter'){ app.feuille = { type: 'contacter', tel: el.dataset.tel, nom: el.dataset.nom, mode: el.dataset.mode, retour: app.feuille }; }
    else if(a === 'ouvrir-crm'){
      const crm = crmApps()[Number(el.dataset.i) || 0] || crmApps()[0], num = el.dataset.tel || '';
      try{ if(navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(num); }catch(e){}
      app.feuille = null; rendre();
      annoncer('📋 ' + num + ' copié — colle-le dans ' + crm.nom);
      const lien = lienApplication(crm);
      try{
        if(window.GFXM_OUVRIR_TEST) window.GFXM_OUVRIR_TEST(lien);
        else if(/^https:/.test(lien)) window.open(lien, '_blank', 'noopener');
        else window.location.href = lien;
      }catch(e){}
      return;
    }
    else if(a === 'basculer-conformite'){ app.conformiteOuverte = !app.conformiteOuverte; }
    else if(a === 'envoyer-gestes'){ const ok = await envoyerGestes(true); annoncer(ok ? 'Envoyé : l’ordinateur l’appliquera à sa prochaine minute.' : 'Pas envoyé.'); }
    else if(a === 'choisir-contact'){ const champ = $('f-client'); if(champ) champ.value = el.dataset.nom || ''; const s = $('f-suggestions'); if(s) s.innerHTML = ''; return; }
    else if(a === 'connecter-dossier'){ connecterDossierEnvoi(); return; }
    else if(a === 'mettre-a-jour'){ mettreAJourEnvoi(); return; }
    else if(a === 'oublier-code'){ memoriserCode(''); annoncer('Code oublié : il sera demandé à la prochaine ouverture.'); }
    else if(a === 'oublier-dossier'){ await PUB.oublierDossier(); app.dossierEnvoi = ''; app.dossierAutorisation = false; }
    else if(a === 'ouvrir-code'){
      const code = valeurDe('code-ouverture');
      if(!code){ annoncer('Entre ton code.'); return; }
      app.onglet = 'agenda';
      if(app.dossierEnvoi) await actualiserEnvoi(true, true);
      await ouvrirPublication(code); return;
    }
    else if(a === 'connecter'){
      if($('cfg-client')) OD.ecrireConfig({ ...config(), clientId: ($('cfg-client').value || '').trim(), tenantId: ($('cfg-tenant').value || '').trim() });
      try{ await OD.connecter(); }catch(e){ app.erreur = e.message; }
    }
    else if(a === 'deconnecter'){ OD.deconnecter(); M.vider(m); lecteur = null; app.charge = false; app.source = null; app.moi = null; }
    else if(a === 'choisir-dossier'){ naviguer([]); return; }
    else if(a === 'entrer-dossier'){ const d = app.navigation.dossiers[Number(el.dataset.i)]; naviguer(app.navigation.pile.concat([d])); return; }
    else if(a === 'remonter'){ naviguer(app.navigation.pile.slice(0, -1)); return; }
    else if(a === 'fermer-navigation'){ app.navigation = null; }
    else if(a === 'prendre-dossier'){
      const d = app.navigation.pile[app.navigation.pile.length - 1];
      OD.ecrireConfig({ ...config(), dossier: { id: d.id, driveId: d.driveId || '', name: d.name } });
      app.navigation = null; lecteur = null; app.onglet = 'agenda'; chargerOneDrive(false); return;
    }
    else if(a === 'charger-onedrive'){ app.onglet = 'agenda'; chargerOneDrive(false); return; }
    rendre();
  });
  document.addEventListener('keydown', (ev) => {
    if(ev.key === 'Enter' && ev.target && ev.target.id === 'code-ouverture'){ ev.preventDefault(); const b = document.querySelector('[data-action="ouvrir-code"]'); if(b) b.click(); }
  });
  document.addEventListener('input', (ev) => {
    if(ev.target.id === 'f-client'){
      const s = $('f-suggestions'), q = ev.target.value.trim();
      if(s) s.innerHTML = q.length < 2 ? '' : M.chercherClients(m, q).slice(0, 6).map(c => '<button type="button" class="bouton second" data-action="choisir-contact" data-nom="' + esc(c.nom) + '" style="display:block;width:100%;text-align:left;margin:4px 0;">👤 ' + esc(c.nom) + (valeur(c.telephone) ? ' <small style="opacity:.7">· ' + esc(valeur(c.telephone)) + '</small>' : '') + '</button>').join('');
      return;
    }
    if(ev.target.id === 'recherche'){ app.recherche = ev.target.value; const l = $('liste-clients'); if(l) l.innerHTML = listeClients(); }
  });
  document.addEventListener('change', (ev) => {
    if(ev.target.id === 'fichier-envoi'){ const l = ev.target.files; if(l && l.length) importerEnvoi(l.length > 1 ? l : l[0]); return; }
    if(ev.target.id === 'cfg-verrou'){ OD.ecrireConfig({ ...config(), verrouMin: Number(ev.target.value) }); }
    if(ev.target.id === 'cfg-couleur'){ OD.ecrireConfig({ ...config(), couleur: ev.target.value }); }
    if(ev.target.classList && ev.target.classList.contains('cfg-crm')){
      const l = crmApps(), i = Number(ev.target.dataset.i) || 0, v = ev.target.value.trim();
      const champ = ev.target.dataset.champ;
      if(champ === 'nom') l[i].nom = v || CRM_DEFAUT[i].nom;
      else if(champ === 'raccourci') l[i].raccourci = v || CRM_DEFAUT[i].raccourci;
      else if(champ === 'android') l[i].android = paquetValide(v) ? v : CRM_DEFAUT[i].android;
      OD.ecrireConfig({ ...config(), crmApps: l });
    }
    if(ev.target.id === 'f-fixe'){
      const h = $('f-heure'), aide = $('f-aide');
      if(h) h.disabled = !ev.target.checked;
      if(aide) aide.textContent = ev.target.checked ? 'La tâche garde cette heure.' : 'L’agenda la placera dans tes plages ce jour-là.';
    }
  });
  // Glisser du doigt vers la gauche ou la droite : période suivante ou précédente.
  let toucheDepart = null;
  document.addEventListener('touchstart', (ev) => {
    if(app.onglet !== 'agenda' || app.feuille || !ev.touches || ev.touches.length !== 1) return;
    toucheDepart = { x: ev.touches[0].clientX, y: ev.touches[0].clientY, t: Date.now() };
  }, { passive: true });
  document.addEventListener('touchend', (ev) => {
    if(!toucheDepart || !ev.changedTouches || !ev.changedTouches.length) return;
    const dx = ev.changedTouches[0].clientX - toucheDepart.x, dy = ev.changedTouches[0].clientY - toucheDepart.y, rapide = Date.now() - toucheDepart.t < 600;
    toucheDepart = null;
    if(rapide && Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)){
      const v = VUES_TEL.indexOf(app.vue) !== -1 ? app.vue : 'planning', s = dx < 0 ? 1 : -1;
      app.date = v === 'planning' ? addDays(app.date, 7 * s) : CAL.decaler(v, app.date, s);
      rendre();
    }
  }, { passive: true });
  $('actualiser').addEventListener('click', actualiser);
  $('deverrouiller').addEventListener('click', () => {
    $('verrou').hidden = true;
    if(app.source === 'demo') ouvrirDemo();
    else if(PUB.actif()){ app.source = 'publication'; app.onglet = 'agenda'; rendre(); ouvrirSansCode(); }
    else { app.onglet = 'reglages'; rendre(); }
  });

  // ---- Démarrage -----------------------------------------------------------------------------
  (async function demarrer(){
    // Version publiée : l'agenda arrive de l'ordinateur ; on demande le code.
    if(PUB.actif()){ app.source = 'publication'; rendre(); ouvrirSansCode(); return; }
    rendre();
    try{
      const retour = await OD.terminerConnexion();
      if(retour || OD.estConnecte()){
        app.moi = await OD.moi().catch(() => null);
        if(config().dossier){ await chargerOneDrive(false); return; }
        app.onglet = 'reglages';
      }
    }catch(e){ app.erreur = e.message; app.onglet = 'reglages'; }
    rendre();
  })();
})();
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});</script>
